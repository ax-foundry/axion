name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: mypy  # Skip mypy in CI for now (has pre-existing issues)

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,search,langfuse]"

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          # Prevent tests from requiring API keys
          OPENAI_API_KEY: "test-key"

      - name: Run tracing tests on the oldest supported Langfuse SDK
        run: |
          floor=$(python -c "import re, tomllib; spec = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['langfuse'][0]; print(re.search(r'>=([0-9.]+)', spec).group(1))")
          pip install "langfuse==$floor"
          pytest tests/_core/tracing -q --tb=short
        env:
          OPENAI_API_KEY: "test-key"
